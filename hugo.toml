baseURL = "https://karthikeyasharma16.github.io/"
locale = "en-us"
title = "Karthikeya Sharma"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true
summaryLength = 30
pagination.pagerSize = 10

[markup.goldmark.renderer]
  # Your migrated pages contain raw HTML (tables, figures, styled divs).
  unsafe = true

[markup.highlight]
  style = "github-dark"
  noClasses = false

[params]
  description = "Hardware Engineer @MangoBoost Inc."
  author = "Karthikeya Sharma"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  hideFooter = false

  [params.profileMode]
    enabled = true
    title = "Karthikeya Sharma"
    subtitle = "Hardware Engineer"
    imageUrl = "img/profile.jpg"
    imageTitle = "Karthikeya Sharma"
    imageWidth = 200
    imageHeight = 200

    [[params.profileMode.buttons]]
      name = "CV"
      url = "cv"
    [[params.profileMode.buttons]]
      name = "Publications"
      url = "publications"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/KarthikeyaSharma16"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/karthikeyasharma16/"
  [[params.socialIcons]]
    name = "googlescholar"
    url = "https://scholar.google.com/citations?user=O4Tya_YAAAAJ&hl=en"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:sharmakarthikeya6@gmail.com"

